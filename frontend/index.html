<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous SDR Control Plane</title>

  <!-- Fonts are loaded non-blocking (media=print swapped to all on load) so a slow/blocked
       network never delays first paint. The app renders with the system-ui fallback either way. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />

  <style>
    :root{
      --bg:#F7F9FC; --surface:#FFFFFF; --border:#E3E8EF; --border-strong:#C7D0DC;
      --text:#101828; --text-2:#475467; --text-3:#98A2B3;
      --accent:#2453E6; --accent-soft:#EBF1FF; --accent-strong:#173FBF;
      --success:#16794F; --success-soft:#EAF7F0;
      --warning:#B4560A; --warning-soft:#FDF3E8;
      --danger:#C0293D; --danger-soft:#FCEBEE;
      --neutral-soft:#EEF1F5;
      --radius:12px; --radius-sm:8px;
    }
    *{box-sizing:border-box;}
    html, body, #root { height: 100%; margin: 0; }
    body{font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:14px;min-width:1200px;}
    /* Replaces the two Tailwind utility classes the shell layout used (cdn.tailwindcss.com
       is not needed anywhere else in this app — everything else uses the named classes below). */
    .flex{display:flex;}
    .overflow-hidden{overflow:hidden;}
    .overflow-auto{overflow:auto;}

    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
    .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;border:1px solid transparent;font-family:inherit;cursor:pointer;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover:not(:disabled){background:var(--accent-strong);}
    .btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
    .btn-secondary:hover:not(:disabled){background:var(--neutral-soft);}
    .btn-success{background:var(--success);color:#fff;}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-danger-outline{background:#fff;color:var(--danger);border-color:#EFC2CB;}
    .btn-danger-outline:hover:not(:disabled){background:var(--danger-soft);}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;color:var(--text-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:11px 18px;border-bottom:1px solid var(--border);}
    td{padding:13px 18px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr.clickable{cursor:pointer;}
    tr.clickable:hover td{background:#FAFBFD;}

    .navitem{display:flex;align-items:center;gap:11px;padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-2);width:100%;text-align:left;background:transparent;border:0;font-family:inherit;cursor:pointer;}
    .navitem:hover{background:var(--neutral-soft);}
    .navitem.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;background:var(--neutral-soft);color:var(--text-2);font-size:11.5px;font-weight:600;white-space:nowrap;}
    .subtab{padding:10px 4px;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;}
    .subtab.active{color:var(--accent-strong);border-bottom-color:var(--accent);}
    .approvalrow{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:0;border-bottom:1px solid var(--border);background:#fff;width:100%;text-align:left;font-family:inherit;cursor:pointer;}
    .approvalrow:hover{background:#FAFBFD;}
    .approvalrow.selected{background:var(--accent-soft);}
    .agentrow{display:flex;align-items:center;gap:10px;padding:13px 16px;border:0;border-bottom:1px solid var(--border);background:#fff;width:100%;text-align:left;font-family:inherit;cursor:pointer;color:var(--text);}
    .agentrow:hover{background:#FAFBFD;}
    .agentrow.selected{background:var(--accent-soft);}
    .section-title{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}
    .section-title-lg{font-size:14px;font-weight:700;margin-bottom:14px;}
    .field-label{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px;display:block;}
    .field-hint{font-size:11.5px;color:var(--text-3);margin-top:5px;}
    .field-error{font-size:11.5px;color:var(--danger);margin-top:5px;font-weight:500;}
    .input{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--text);font-family:inherit;background:#fff;}
    .input::placeholder{color:var(--text-3);}
    .input.error{border-color:var(--danger);}
    textarea.input{resize:vertical;line-height:1.5;}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:600;color:var(--text-2);background:#fff;font-family:inherit;cursor:pointer;}
    .chip.selected{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent-soft);}
    .chip.dashed{border-style:dashed;}
    .toggle{width:36px;height:20px;border-radius:999px;flex-shrink:0;position:relative;border:0;padding:0;cursor:pointer;}
    .toggle.on{background:var(--accent);}
    .toggle.success.on{background:var(--success);}
    .toggle.off{background:var(--border-strong);}
    .toggle:disabled{opacity:.5;cursor:not-allowed;}
    .toggle .knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;}
    .toggle.on .knob{right:2px;}
    .toggle.off .knob{left:2px;}
    .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
    .row:last-child{border-bottom:none;}
    .link{background:none;border:0;padding:0;color:var(--accent-strong);font-weight:600;font-size:inherit;font-family:inherit;cursor:pointer;}
    .link:hover{text-decoration:underline;}
    .killbtn{display:flex;align-items:center;gap:6px;border:1px solid #EFC2CB;color:var(--danger);background:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;flex-shrink:0;}
    .killbtn:hover{background:var(--danger-soft);}
    .killbtn.active{background:var(--danger);border-color:var(--danger);color:#fff;}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
